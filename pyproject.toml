[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logo-finder"
version = "0.1.0"
description = "Find a logo in a mosaic of icons. Crop, upscale, or render a zoom animation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ernani Britto" }]
keywords = ["opencv", "template-matching", "image-processing", "logo", "mosaic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
logo-finder = "logo_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logo_finder"]

[tool.ruff]
line-length = 100
target-version = "py310"
